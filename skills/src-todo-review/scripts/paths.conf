# Path classes for inventory.py.  One "<class> <path prefix>" per line.
#
#   exclude  never scanned: third-party code imported through vendor
#            branches.  Fix such markers upstream, not in FreeBSD.
#   vendor   scanned and triaged, but the code is maintained by (or
#            synchronised from) a hardware vendor or another project, so
#            changes need that maintainer.  Triaged after everything else.
#
# A prefix ending in "/" matches a directory; otherwise it matches any path
# that starts with it (e.g. sys/dev/e1000/e1000_ matches the shared code).

exclude contrib/
exclude crypto/
exclude cddl/contrib/
exclude sys/contrib/
exclude sys/cddl/contrib/

vendor sys/gnu/
vendor sys/ofed/
vendor sys/dev/ath/ath_hal/
vendor sys/dev/bnxt/
vendor sys/dev/bxe/
vendor sys/dev/e1000/e1000_
vendor sys/dev/ena/
vendor sys/dev/hyperv/
vendor sys/dev/iavf/
vendor sys/dev/ice/
vendor sys/dev/igc/igc_
vendor sys/dev/irdma/
vendor sys/dev/isci/
vendor sys/dev/ixgbe/ixgbe_
vendor sys/dev/ixl/i40e_
vendor sys/dev/mlx4/
vendor sys/dev/mlx5/
vendor sys/dev/mpi3mr/
vendor sys/dev/ocs_fc/
vendor sys/dev/pms/
vendor sys/dev/qat/
vendor sys/dev/qlnx/
vendor sys/dev/qlxgb/
vendor sys/dev/qlxgbe/
vendor sys/dev/qlxge/
vendor sys/dev/sfxge/common/
vendor sys/dev/smartpqi/
